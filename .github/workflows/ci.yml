name: CI

on:
  push:
    branches:
      - main
      - snake9
  pull_request:
    branches_ignore: [ ]

defaults:
  run:
    shell: bash

env:
  PIXI_VERSION: v0.75.0

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: dev
          cache: true
          frozen: true

      - name: Run linting tools
        run: pixi run -e dev lint

      - name: Comment PR
        if: github.event_name == 'pull_request' && failure()
        uses: marocchino/sticky-pull-request-comment@v1.1.0
        with:
          message: |
            - Please format your Python code with [ruff](https://docs.astral.sh/ruff/): `pixi run -e dev fmt`
            - Please check your Python code with [ruff](https://docs.astral.sh/ruff/): `pixi run -e dev check`
            - Please format your Snakemake code with [snakefmt](https://github.com/snakemake/snakefmt): `pixi run -e dev snakefmt`

            You can trigger all lints locally by running `pixi run -e dev lint`
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pins:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed environment files come with their pin files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE"...HEAD)
          stale=()
          while read -r env; do
            pin="$(dirname "$env")/environment.linux-64.pin.txt"
            # symlinked environment files share their target's pin; unpinned ones have none
            if [[ -f "$env" && ! -L "$env" && -f "$pin" ]] && ! grep -qxF "$pin" <<< "$changed"; then
              stale+=("$env")
            fi
          done < <(grep -E '^snappy_wrappers/wrappers/.+/environment\.yaml$' <<< "$changed" || true)
          if (( ${#stale[@]} )); then
            echo "Pin these environments again: pixi run -e dev update-pins ${stale[*]}"
            exit 1
          fi

  testing:
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: test
          cache: true
          frozen: true

      - name: Run tests
        run: pixi run -e test test

      - name: Coveralls
        uses: AndreMiras/coveralls-python-action@develop

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: docs
          cache: true
          frozen: true

      - name: Build documentation
        run: pixi run -e docs docs
