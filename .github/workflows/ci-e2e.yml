name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches_ignore: [ ]
    paths:
      - '.tests/**'
      - '.github/workflows/ci-e2e.yml'
      - 'snappy_pipeline/**'
      - 'snappy_wrappers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'

defaults:
  run:
    shell: bash

jobs:
  dryrun:
    name: Dry-run all pipeline configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: default
          cache: true
          frozen: true

      - name: Dry-run each pipeline
        run: |
          set -euo pipefail
          for pipeline_dir in .tests/test-workflow/pipelines/*/; do
            echo "==> Dry-run: ${pipeline_dir}"
            (cd "${pipeline_dir}" && pixi run snappy run -n -- --cores 1)
          done

  run:
    name: Run all pipeline configs
    runs-on: ubuntu-latest
    needs: dryrun
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: default
          cache: true
          frozen: true

      - name: Run each pipeline
        run: |
          set -euo pipefail
          for pipeline_dir in .tests/test-workflow/pipelines/*/; do
            echo "==> Running: ${pipeline_dir}"
            (cd "${pipeline_dir}" && pixi run snappy run -- --cores 1 --software-deployment-method conda --show-failed-logs)
          done
