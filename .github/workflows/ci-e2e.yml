name: Tests

on:
  push:
    branches: [ main, snake9 ]
  pull_request:
    branches_ignore: [ ]
    paths:
      - '.tests/**'
      - '.github/workflows/ci-e2e.yml'
      - 'snappy_pipeline/**'
      - 'snappy_wrappers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'

defaults:
  run:
    shell: bash

env:
  PIXI_VERSION: v0.84.2

jobs:
  dryrun:
    name: Dry-run all pipeline configs
    runs-on: ubuntu-latest
    steps:
      # A dry run needs the files to exist, not their contents, so the LFS pointers suffice
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          cache: true
          frozen: true

      # The simulated pedigree needs the reference for its reads
      - name: Simulate the pedigree reads
        run: |
          git lfs pull --include=".tests/test-workflow/resources/refs/subregion.fa"
          pixi run python .tests/test-workflow/simulate_pedigree.py
          pixi run python .tests/test-workflow/simulate_umi.py

      - name: Dry-run each pipeline
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(.tests/test-workflow/pipelines/*/config.yaml)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No pipeline configs found in .tests/test-workflow/pipelines"
            exit 1
          fi
          for config_path in "${configs[@]}"; do
            pipeline_dir="$(dirname "${config_path}")"
            echo "==> Dry-run: ${config_path}"
            (cd "${pipeline_dir}" && pixi run snappy run -n -- --cores 1)
          done

  run:
    name: Run all pipeline configs
    runs-on: ubuntu-latest
    needs: dryrun
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          cache: true
          frozen: true

      - name: Pull LFS test fixtures
        run: |
          git lfs pull --include=".tests/test-workflow/pipelines/**,.tests/test-workflow/resources/**"

      # The package archives of the wrapper environments, shared by the pipelines (--sdm-cache-prefix)
      - name: Cache wrapper environment packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/snappy-sdm
          key: sdm-${{ hashFiles('snappy_wrappers/wrappers/**/environment.linux-64.pin.txt') }}
          restore-keys: sdm-

      - name: Simulate the pedigree and the UMI reads
        run: |
          pixi run python .tests/test-workflow/simulate_pedigree.py
          pixi run python .tests/test-workflow/simulate_umi.py

      - name: Run each pipeline
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(.tests/test-workflow/pipelines/*/config.yaml)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No pipeline configs found in .tests/test-workflow/pipelines"
            exit 1
          fi
          for config_path in "${configs[@]}"; do
            pipeline_dir="$(dirname "${config_path}")"
            echo "==> Running: ${config_path}"
            (cd "${pipeline_dir}" && pixi run snappy run -- --cores 1 --software-deployment-method conda \
              --sdm-cache-prefix "$HOME/.cache/snappy-sdm" --show-failed-logs)
          done

      - name: Check the events of the simulated pedigree
        run: pixi run python .tests/test-workflow/pipelines/snappy-germline_pedigree/check_events.py

      - name: Check the consensus reads of the simulated UMI library
        run: pixi run python .tests/test-workflow/pipelines/snappy-umi/check_consensus.py
