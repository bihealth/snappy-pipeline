name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches_ignore: [ ]
    paths:
      - '.tests/**'
      - '.github/workflows/ci-e2e.yml'
      - 'snappy_pipeline/**'
      - 'snappy_wrappers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'

defaults:
  run:
    shell: bash

jobs:
  Dryrun_Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: default
          cache: true
          frozen: true

      - name: Test workflow (local FASTQs) - Dryrun
        run: >
          pixi run snakemake
          --directory .tests/test-workflow
          --snakefile .tests/test-workflow/workflow/Snakefile
          --configfile .tests/test-workflow/config/config.yaml
          --software-deployment-method conda
          --show-failed-logs
          -j 2
          --dryrun

  Tests:
    runs-on: ubuntu-latest
    needs: Dryrun_Tests
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: default
          cache: true
          frozen: true

      - name: Test workflow (local FASTQs)
        run: >
          pixi run snakemake
          --directory .tests/test-workflow
          --snakefile .tests/test-workflow/workflow/Snakefile
          --configfile .tests/test-workflow/config/config.yaml
          --software-deployment-method conda
          --show-failed-logs
          -j 2
