name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches_ignore: [ ]
    paths:
      - '.tests/**'
      - '.github/workflows/ci-e2e.yml'
      - 'snappy_pipeline/**'
      - 'snappy_wrappers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.lock'

defaults:
  run:
    shell: bash

env:
  PIXI_VERSION: v0.75.0

jobs:
  dryrun:
    name: Dry-run all pipeline configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          cache: true
          frozen: true

      - name: Pull LFS test fixtures
        run: |
          git lfs pull --include=".tests/test-workflow/pipelines/**,.tests/test-workflow/resources/**"

      - name: Dry-run each pipeline
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(.tests/test-workflow/pipelines/*/config.yaml)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No pipeline configs found in .tests/test-workflow/pipelines"
            exit 1
          fi
          for config_path in "${configs[@]}"; do
            pipeline_dir="$(dirname "${config_path}")"
            echo "==> Dry-run: ${config_path}"
            (cd "${pipeline_dir}" && pixi run snappy run -n -- --cores 1)
          done

  run:
    name: Run all pipeline configs
    runs-on: ubuntu-latest
    needs: dryrun
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          cache: true
          frozen: true

      - name: Pull LFS test fixtures
        run: |
          git lfs pull --include=".tests/test-workflow/pipelines/**,.tests/test-workflow/resources/**"

      - name: Run each pipeline
        run: |
          set -euo pipefail
          shopt -s nullglob
          configs=(.tests/test-workflow/pipelines/*/config.yaml)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No pipeline configs found in .tests/test-workflow/pipelines"
            exit 1
          fi
          for config_path in "${configs[@]}"; do
            pipeline_dir="$(dirname "${config_path}")"
            echo "==> Running: ${config_path}"
            (cd "${pipeline_dir}" && pixi run snappy run -- --cores 1 --software-deployment-method conda --show-failed-logs)
          done
