# Snappy Pipeline Project "%(project_name)s" Configuration
#
# created: %(created_at)s
#
# The fields of a step with their descriptions: its page in the documentation,
# https://snappy-pipeline.readthedocs.io/en/latest/, or `snappy task add --config-mode commented`.

project:
  name: %(project_name_yaml)s
  external_id: %(external_id_yaml)s
  description: %(description_yaml)s

sample_sheets:
  - %(sheet_file)s

tasks:
  - name: reads
    step: external_data
    config:
      produces: {type: reads}
      library_files: [%(reads_table)s]
