# Snappy Pipeline Project "%(project_name)s" Configuration
#
# created: %(created_at)s

# Paths ==============================================================================
#
# Relative paths are relative to this directory. pathvars names roots for paths, used as
# <name> in any path, with the defaults of Snakemake (such as <resources>).
# `snappy check-files` lists the files of this configuration that do not exist.
#
# pathvars:
#   refs: /path/to/refs/GRCh38

# Task Configuration ================================================================
#
# Define pipeline tasks.  Each task references a step type, a unique name,
# and a self-contained config block.
#
# Use `snappy task add` to add tasks incrementally.
#
# Files that must match the reference come from tasks, usually external_data, which other
# tasks name in depends_on: the genome (depends_on.reference; its .fai and .dict must be next
# to the FASTA), the gene annotation, dbSNP, BED files of regions (type regions) and a tool's
# database (depends_on.database: type database, tagged with the tool). Mappers read their
# index from depends_on.index: a reference_index task, or external_data for an existing one.
# Files that belong to one tool's setup and do not depend on the reference stay in its section.
#
# Example
# -------
#
# tasks:
#   - name: genome
#     step: external_data
#     config:
#       produces: {type: raw, tags: [reference, dna]}
#       files: {fasta: /path/to/genome.fa}
#   - name: dbsnp
#     step: external_data
#     config:
#       produces: {type: variants, tags: [dbsnp]}
#       files: {vcf: /path/to/dbsnp.vcf.gz}
#   - name: bwa_index
#     step: external_data
#     config:
#       produces: {type: index, tags: [bwa, dna]}
#       files: {index: /path/to/bwa/genome}  # prefix of the .amb, .ann, ... files
#   - name: vep_cache
#     step: external_data
#     config:
#       produces: {type: database, tags: [vep]}
#       files: {cache: /path/to/vep/cache}
#
tasks: []

# Data Sets ========================================================================
#
# Define data sets with sample sheets and search paths/patterns for raw FASTQ files.
# Search patterns are regular expressions for the path below each library's folder; their
# (?P<readgroup>...) group pairs the left and right file of each lane.
#
# Example
# -------
#
# data_sets:
#   first_batch:
#     file: samplesheet.tsv
#     search_patterns:
#     - {left: '(?P<readgroup>.+)_R1_001\.fastq\.gz', right: '(?P<readgroup>.+)_R2_001\.fastq\.gz'}
#     search_paths:
#     - /path/to/raw/data
#     type: germline_variants
#
data_sets: {}

# Resources =======================================================================
#
# Memory and runtime of a job grow with each retry by retry_factor.
#
# resources:
#   retry_factor: 1.5
