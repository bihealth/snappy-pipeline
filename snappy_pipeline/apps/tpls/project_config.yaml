# Snappy Pipeline Project "%(project_name)s" Configuration
#
# created: %(created_at)s

# Project ==========================================================================
#
# The name of the project, and its identifier in an external data management system, such
# as the SODAR project UUID, which tracks where the raw data lives.

project:
  name: %(project_name_yaml)s
  external_id: %(external_id_yaml)s
  description: %(description_yaml)s

# Paths ==============================================================================
#
# Relative paths are relative to this directory. pathvars names roots for paths, used as
# <name> in any path, with the defaults of Snakemake (such as <resources>).
# `snappy check-files` lists the files of this configuration that do not exist.
#
# pathvars:
#   refs: /path/to/refs/GRCh38

# Sample sheets ======================================================================
#
# The sample sheets: plain TSV files, one row per library (donor_name, library_name,
# library_type and the columns the tasks need; see the documentation), checked by
# `snappy sheet check`. The FASTQ files of the libraries come from the `reads` task below:
# `snappy scan-files` lists them in %(reads_table)s from the files below raw/ in a folder named like
# the library (or its folder_name), or named after it (<library>_..., flat or in batch folders),
# with the common namings (_R1_001.fastq.gz, .R1.fastq.gz, _1.fq.gz, ...). Another layout takes
# --search-path and --pattern key=regex; the table records the command for later rescans.

sample_sheets:
  - %(sheet_file)s

# Resources =======================================================================
#
# Memory and runtime of a job grow with each retry by retry_factor.
#
# resources:
#   retry_factor: 1.5

# Task Configuration ================================================================
#
# Define pipeline tasks.  Each task references a step type, a unique name,
# and a self-contained config block.
#
# Use `snappy task add` to add tasks incrementally.
#
# Files that must match the reference come from tasks, usually external_data, which other
# tasks name in depends_on: the genome (depends_on.reference; its .fai and .dict must be next
# to the FASTA), the gene annotation, dbSNP and other VCF resources (their .tbi, or .idx for a
# plain .vcf, must be next to them), BED files of regions (type regions; the gCNV mappability
# BED needs its index next to it, too) and a tool's database (depends_on.database: type database, tagged with
# the tool). Mappers read their index from depends_on.index: a reference_index task built from
# the genome in their depends_on.reference, or external_data for an existing one.
# Files that belong to one tool's setup and do not depend on the reference stay in its section.
#
# Example
# -------
#
# tasks:
#   - name: genome
#     step: external_data
#     config:
#       produces: {type: sequences, tags: [reference, dna]}
#       files: {fasta: /path/to/genome.fa}
#   - name: dbsnp
#     step: external_data
#     config:
#       produces: {type: variants, tags: [dbsnp]}
#       files: {vcf: /path/to/dbsnp.vcf.gz}
#   - name: bwa_index
#     step: external_data
#     config:
#       produces: {type: index, tags: [bwa, dna]}
#       files: {index: /path/to/bwa/genome}  # prefix of the .amb, .ann, ... files
#   - name: vep_cache
#     step: external_data
#     config:
#       produces: {type: database, tags: [vep]}
#       files: {cache: /path/to/vep/cache}
#
tasks:
  # The FASTQ files of the libraries: `snappy scan-files` lists them in %(reads_table)s, one row per
  # read group, from the folders below raw/ (one per library, named like the sheet's folderName)
  - name: reads
    step: external_data
    config:
      produces: {type: reads}
      library_files: [%(reads_table)s]
