# Snappy Pipeline Project "%(project_name)s" Configuration
#
# created: %(created_at)s

# Static Data Configuration ==========================================================
#
# Paths to reference data (reference genome, annotation databases, etc.).
# Relative paths are resolved relative to this config file's directory.
#
static_data_config:
  cosmic:
    path: /fast/projects/cubit/current/static_data/db/COSMIC/v72/GRCh37/CosmicAll.vcf.gz
  dbnsfp:
    path: /fast/projects/cubit/current/static_data/db/dbNSFP/2.9/dbNSFP2.9.txt.gz
  dbsnp:
    path: /fast/projects/cubit/current/static_data/db/dbSNP/b147/GRCh37/All_20160408.vcf.gz
  reference:
    path: /fast/projects/cubit/current/static_data/reference/GRCh37/hs37d5/hs37d5.fa

# Task Configuration ================================================================
#
# Define pipeline tasks.  Each task references a step type, a unique name,
# and a self-contained config block.
#
# Use `snappy task add` to add tasks incrementally.
#
tasks: []

# Data Sets ========================================================================
#
# Define data sets with sample sheets and search paths/patterns for raw FASTQ files.
#
# Example
# -------
#
# data_sets:
#   first_batch:
#     file: samplesheet.tsv
#     search_patterns:
#     - {'left': '*_R1.fastq.gz', 'right': '*_R2.fastq.gz'}
#     search_paths:
#     - /path/to/raw/data
#     type: germline_variants
#
data_sets: {}
