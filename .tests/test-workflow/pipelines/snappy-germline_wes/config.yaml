project:
  name: snappy-germline_wes

data_sets:
  trbc:
    file: samplesheet.tsv
    search_patterns:
      - { left: '(?P<readgroup>.+)\.R1\.fastq\.gz', right: '(?P<readgroup>.+)\.R2\.fastq\.gz' }
    search_paths:
      - raw
    type: germline_variants
    naming_scheme: only_secondary_id

tasks:
  - name: genome
    step: external_data
    config:
      produces: {type: raw, tags: [reference, dna]}
      files: {fasta: ../../resources/refs/subregion.fa}

  - name: kits
    step: external_data
    config:
      produces: {type: regions, tags: [kits]}
      kits:
        MedExome:
          targets: resources/Exome-MedExome.chr12.bed
          baits: resources/Exome-MedExome.chr12.bed

  - name: bwa_index
    step: reference_index
    config:
      depends_on:
        reference: genome
      tool: bwa

  - name: dbsnp
    step: external_data
    config:
      produces: {type: variants, tags: [dbsnp]}
      files: {vcf: ../../resources/refs/dbsnp.vcf.gz}

  - name: mehari_db
    step: external_data
    config:
      produces: {type: database, tags: [mehari]}
      files:
        transcript_db:
          - ../../resources/mehari/GRCh37-ensembl.chr12.txs.bin.zst

  - name: mapping
    step: ngs_mapping
    config:
      depends_on:
        reads: data_sets
        reference: genome
        index: bwa_index
      tool: bwa
      bwa:
        mask_duplicates: false
        memory_bam_sort: 2G
        num_threads_bam_sort: 2
        num_threads_bam_view: 2
        num_threads_align: 2

  - name: coverage_qc
    step: ngs_data_qc
    config:
      depends_on:
        alignments: mapping
        reference: genome
        kits: kits
      tool: alfred
      alfred: {}

  - name: variant_calling
    step: variant_calling
    config:
      depends_on:
        alignments: mapping
        reference: genome
        dbsnp: dbsnp
      group_by: related
      tool: gatk4_hc_gvcf
      gatk4_hc_gvcf: {}

  - name: annotation
    step: variant_annotation
    config:
      depends_on:
        variants: variant_calling
        reference: genome
        database: mehari_db
      tool: "mehari"
      mehari:
        assembly: GRCh37

  - name: filtration_final
    step: variant_filtration
    config:
      tool: vembrane
      calls_report: {}
      depends_on:
        variants: annotation
      vembrane:
        mode: filter
        expression: 'QUAL > 10'
        extra_arguments: ["--backend pysam"]

  # Varlociraptor on the trio: candidates per pedigree in the kit's targets, calls against the
  # germline scenario, FDR control on present and de novo variants, then the annotation
  - name: candidates
    step: variant_calling
    config:
      depends_on:
        alignments: mapping
        reference: genome
        kits: kits
      group_by: related
      tool: freebayes
      freebayes:
        num_jobs: 2

  - name: calling_varlociraptor
    step: variant_calling
    config:
      depends_on:
        alignments: mapping
        reference: genome
        candidates: candidates
      tool: varlociraptor
      varlociraptor:
        scenario: germline
        num_jobs: 2

  - name: fdr_varlociraptor
    step: variant_filtration
    config:
      depends_on:
        variants: calling_varlociraptor
      tool: varlociraptor
      calls_report: {}
      varlociraptor:
        events: [present, denovo, recessive, dominant]

  - name: annotation_varlociraptor
    step: variant_annotation
    config:
      depends_on:
        variants: fdr_varlociraptor
        reference: genome
        database: mehari_db
      tool: "mehari"
      calls_report: {}
      mehari:
        assembly: GRCh37

  # Structural variants of the trio from delly2 as candidates for varlociraptor
  - name: sv_calling
    step: sv_calling_targeted
    config:
      depends_on:
        alignments: mapping
        reference: genome
      tool: delly2
      delly2: {}

  - name: calling_varlociraptor_sv
    step: variant_calling
    config:
      depends_on:
        alignments: mapping
        reference: genome
        candidates: sv_calling
      tool: varlociraptor
      varlociraptor:
        scenario: germline
        num_jobs: 2

  - name: fdr_varlociraptor_sv
    step: variant_filtration
    config:
      depends_on:
        variants: calling_varlociraptor_sv
      tool: varlociraptor
      varlociraptor:
        events: [present, denovo, recessive, dominant]

  # The small variants and the structural variants of the trio in one VCF
  - name: concat_varlociraptor
    step: concat_variants
    config:
      depends_on:
        variants: [fdr_varlociraptor, fdr_varlociraptor_sv]
      tool: bcftools
      bcftools: {}
