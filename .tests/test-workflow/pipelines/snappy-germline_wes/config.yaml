tasks:
  - name: genome
    step: external_data
    config:
      produces: {type: raw, tags: [reference, dna]}
      files: {fasta: ../../resources/refs/subregion.fa}

  - name: kits
    step: external_data
    config:
      produces: {type: regions, tags: [kits]}
      kits:
        MedExome:
          targets: resources/Exome-MedExome.chr12.bed
          baits: resources/Exome-MedExome.chr12.bed

  - name: bwa_index
    step: reference_index
    config:
      depends_on:
        reference: genome
      tool: bwa

  - name: dbsnp
    step: external_data
    config:
      produces: {type: variants, tags: [dbsnp]}
      files: {vcf: ../../resources/refs/dbsnp.vcf.gz}

  - name: mehari_db
    step: external_data
    config:
      produces: {type: database, tags: [mehari]}
      files:
        transcript_db:
          - ../../resources/mehari/GRCh37-ensembl.chr12.txs.bin.zst

  - name: mapping
    step: ngs_mapping
    config:
      depends_on:
        reads: data_sets
        reference: genome
        index: bwa_index
        kits: kits
      tool: bwa
      bwa:
        mask_duplicates: false
        memory_bam_sort: 2G
        num_threads_bam_sort: 2
        num_threads_bam_view: 2
        num_threads_align: 2
      ngs_chew_fingerprint:
        enabled: false
      target_coverage_report:
        enabled: true

  - name: variant_calling
    step: variant_calling
    config:
      depends_on:
        alignments: mapping
        reference: genome
        dbsnp: dbsnp
      group_by: cohort
      tool: gatk4_hc_gvcf
      gatk4_hc_gvcf: {}

  - name: annotation
    step: variant_annotation
    config:
      depends_on:
        variants: variant_calling
        reference: genome
        database: mehari_db
      tool: "mehari"
      mehari:
        assembly: GRCh37

  - name: filtration_final
    step: variant_filtration
    config:
      tool: vembrane
      depends_on:
        variants: annotation
      vembrane:
        mode: filter
        expression: 'QUAL > 10'
        extra_arguments: ["--backend pysam"]

data_sets:
  trbc:
    file: samplesheet.tsv
    search_patterns:
      - { left: '(?P<readgroup>.+)\.R1\.fastq\.gz', right: '(?P<readgroup>.+)\.R2\.fastq\.gz' }
    search_paths:
      - raw
    type: germline_variants
    naming_scheme: only_secondary_id
