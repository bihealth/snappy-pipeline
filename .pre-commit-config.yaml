repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/snakemake/snakefmt
    rev: v1.1.0 # https://github.com/snakemake/snakefmt/releases
    hooks:
      - id: snakefmt
        # snakefmt cannot parse `use rule * from <module> as <prefix>*` in the orchestrator;
        # CI likewise only checks snappy_pipeline/workflows/*/Snakefile.
        exclude: ^snappy_pipeline/Snakefile$
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (shell scripts and the shell templates of the wrappers)
        entry: pixi run --frozen -e dev python tests/scripts/shell_templates.py --write
        language: system
        files: ^(snappy_wrappers/wrappers/.*\.py|.*\.sh)$
