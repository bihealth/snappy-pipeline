[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snappy-pipeline"
authors = [
    { name = "Manuel Holtgrewe", email = "manuel.holtgrewe@bih-charite.de" },
]
description = "SNAPPY Nucleic Acid Processing in Python (by CUBI)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["bioinformatics"]
license = "MIT"
license-files = ["LICENSE.rst"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    # The command line interface
    "click >=8.4,<9",
    # Nice, round-trip enabled YAML parsing
    "ruamel.yaml >=0.18.6,<1",
    # Sample sheet parsing
    "biomedsheets >=1.0.1,<2",
    # Snakemake is used for providing the actual wrapper calling functionality; its development
    # version, for the software deployment plugins (software: directive, post-deploy scripts).
    # A commit of upstream main with the merged fixes snakemake#4357 (snakemake.params and
    # makedirs in scripts with Python < 3.11) and #4359 (migration of a 9.x metadata.db).
    # snakemake-interface-common 1.24.1 carries #101 (no enum.StrEnum on Python < 3.11, as in
    # the gCNV environment) and #102 (--sdm-container-mountpoints), the container plugin 0.7.6
    # carries #31 (apptainer runs the pulled image).
    "snakemake @ git+https://github.com/snakemake/snakemake.git@d8528b75c79433cb166713d3c3329513bff208b1",
    "snakemake-interface-common >=1.24.1,<2",
    "snakemake-software-deployment-plugin-conda >=0.8.4,<0.9",
    "snakemake-software-deployment-plugin-container >=0.7.6,<0.8",
    "snakemake-executor-plugin-slurm >=2,<3",
    # snkmt from the head of its open pull request #53 (console polls no longer leak SQLite read
    # locks); its logger plugin from upstream main with the merged #30 (SQLite pragmas for
    # network file systems, as Snakemake's persistence database sets them), until a release
    # carries it
    "snkmt @ git+https://github.com/tedil/snkmt.git@3ac54fc376da0c5d6071caf9e53539ba0dbe30e5",
    "snakemake-logger-plugin-snkmt @ git+https://github.com/cademirch/snakemake-logger-plugin-snkmt.git@dbb6c802e16d0136e1f38a8374b635c4ecfc555b",
    # Required for plotting
    "matplotlib >=3.8.4",
    # Library for working with VCF files.
    "vcfpy >=0.13.8,<1",
    # Support for vcfpy
    "pysam >=0.22.1,<1",
    # Jinja 2 template rendering
    "jinja2 >=3.1.4,<4",
    # The library and donor tables of the sample sheets, the sheet summary and the gCNV tools
    "pandas >=3,<4",
    # YTE rendering of custom varlociraptor scenarios
    "yte >=1.5.5,<2",
    # Parsing of ISA-tab.
    "altamisa >=1,<2",
    # Validation for models, mainly used for configuration validation
    "pydantic >=2.9.0,<3",
    # Rich colored help formatting for Click CLIs
    "rich-click >=1.7.0,<2",
    "rich >=13.0.0",
    # The questions of snappy init and snappy task add on a terminal
    "questionary >=2.1,<3",
    # The SODAR API of snappy pull-sheet
    "requests >=2.32,<3",
]

[project.urls]
Repository = "https://github.com/bihealth/snappy-pipeline"
Documentation = "https://snappy-pipeline.readthedocs.io/en/latest/"
Issues = "https://github.com/bihealth/snappy-pipeline/issues"
Changelog = "https://github.com/bihealth/snappy-pipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Read the Docs installs this extra (.readthedocs.yaml)
docs = [
    "sphinx >=8,<9",
    "sphinx_rtd_theme >=3,<4",
    "myst-parser >=5,<6",
]

[project.scripts]
snappy = "snappy_pipeline.apps.snappy_cli:main"
# The gatk_read_backed_phasing wrapper runs these two
snappy-vcf_filter_from_info = "snappy_wrappers.tools.vcf_filter_from_info:main"
snappy-vcf_filter_to_info = "snappy_wrappers.tools.vcf_filter_to_info:main"

# Development tooling (PEP 735); pixi maps each group to a feature of the same name
[dependency-groups]
test = [
    "pytest >=8.2.2,<10",
    "coverage >=7.5.3,<8",
    "pytest-cov >=5.0.0,<6",
    "pytest-mock >=3.14.0,<4",
    "pytest-subprocess >=1.5.0,<2",
    # Fake file system for testing
    "pyfakefs >=5.5.0,<6",
    "pytest-sugar >=1.0.0,<2",
    # coveralls.io tooling
    "coveralls >=4.0.1,<5",
    "pytabix >=0.1.0,<1"
]
dev = [
    # ruff code linter + formatter
    "ruff >=0.15.11,<1",
    # "snakefmt" code formatter and checker.
    "snakefmt >=1,<2",
    "pre-commit >=4.0.1,<5"
]


# ==============================================================================
# HATCHLING CONFIGURATION
# ==============================================================================

[tool.hatch.version]
path = "snappy_pipeline/version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["snappy_pipeline", "snappy_wrappers"]

[tool.hatch.build.targets.sdist]
# The default walks the whole tree, including the ignored run outputs below .tests/
only-include = ["snappy_pipeline", "snappy_wrappers", "tests", "docs", "CHANGELOG.md", "CONTRIBUTING.md"]


# ==============================================================================
# TOOL CONFIGURATIONS
# ==============================================================================

[tool.coverage.run]
omit = ["snappy_pipeline/Snakefile", "snappy_pipeline/workflows/*/Snakefile", "snappy_wrappers/wrappers/*/wrapper.py"]
relative_files = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == '__main__':"]

[tool.ruff]
# In addition to Ruff's default excludes
extend-exclude = [
    "build", "docs", ".*.py", ".snakemake.*.wrapper.py", "splitMNPsAndComplex.py",
    "snappy_pipeline/__init__.py", ".tests",
]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B9"]  # enable "B", "C" later
ignore = ["E203", "E266", "E501", "B904", "B905", "E713", "E721", "E741"]

[tool.ruff.lint.per-file-ignores]
# Snakemake provides the global snakemake to wrappers
"snappy_wrappers/wrappers/**/wrapper.py" = ["F821"]
"docs/conf.py" = ["ALL"]

[tool.snakefmt]
line_length = 100
include = "\\.smk$|\\.rules$|^Snakefile"
exclude = "snappy_pipeline/Snakefile"

[tool.rumdl.MD013]
# One sentence per line, no line length limit
reflow = true
reflow-mode = "sentence-per-line"
line-length = 0

[tool.rumdl.MD060]
# Aligned tables
enabled = true
style = "aligned"

# The Sphinx docs are MyST Markdown, and their pages start with a label instead of a heading
[tool.rumdl.per-file-flavor]
"docs/*.md" = "myst"

[tool.rumdl.per-file-ignores]
"docs/*.md" = ["MD041"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=snappy_pipeline --cov-report=xml -n auto"
markers = [
    "integration: tests requiring workflow-level integration setup",
    "slow: tests that are expected to take longer runtime",
]
testpaths = ["tests"]
norecursedirs = ["docs", "*.egg-info", ".git"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::coverage.exceptions.CoverageWarning",
]


# ==============================================================================
# PIXI CONFIGURATION
# ==============================================================================

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "nodefaults"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
git-lfs = "~=3.5.1"
gcc_linux-64 = "~=13.2.0"
gcc_impl_linux-64 = "~=13.2.0"
gxx_linux-64 = "~=13.2.0"
gxx_impl_linux-64 = "~=13.2.0"
sysroot_linux-64 = "~=2.17"
binutils_linux-64 = "*"
coreutils = "~=9.5"
gawk = "~=5.3.0"
bash = "~=5.2.21"
gzip = "~=1.13"
zlib = "~=1.3.0"
htslib = "1.20.*"
bcftools = "1.20.*"
samtools = "1.20.*"

# PREVENT CONFLICTS: Force Conda to pick older versions of these
# dependencies so that it doesn't block the PyPI/Git package installations.
tabulate = "<0.10"
docutils = ">=0.20,<0.22"
click = ">=8.4.0,<9"
# Snakemake's development version needs packaging 26.1 or newer
packaging = ">=26.1,<27"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
dev = { features = ["test", "docs", "dev"], solve-group = "default" }
# Pins the wrapper environments: snakedeploy (which needs conda) allows Python 3.12 at most
pins = { features = ["pins"], no-default-feature = true }

[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -W --keep-going -b html docs/ docs/_build/html", description = "Build HTML documentation with Sphinx; warnings fail the build" }
step-overview = { cmd = "mkdir -p docs/_build && python -m snappy_pipeline.step_overview | dot -Tsvg -o docs/_build/step_overview.svg", description = "Render the step overview graph as an SVG slide (docs/_build/step_overview.svg)" }

[tool.pixi.feature.docs.dependencies]
# Renders the step overview graph (sphinx.ext.graphviz and the step-overview task)
graphviz = ">=14.1.2,<15"

[tool.pixi.pypi-dependencies]
snappy-pipeline = { path = ".", editable = true }

# ==============================================================================
# PIXI TASKS
# ==============================================================================

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", env = { PYTHONPATH = "." }, description = "Run tests through pytest" }
coverage = { cmd = "coverage report && coverage html", description = "Generate code coverage reports" }

[tool.pixi.feature.test.dependencies]
pytest-xdist = ">=3.8.0,<4"
# The tests of the qc_summary wrapper tools (snappy_wrappers/tools/qc_summary); fastjsonschema checks
# the datavzrd configuration (jsonschema 4.4 cannot resolve $ref on Python 3.14)
polars = ">=2.1.0,<3"
python-fastjsonschema = ">=2.20,<3"

[tool.pixi.feature.dev.tasks]
fmt = { cmd = "ruff format .", description = "Apply Ruff code formatter" }
snakefmt = { cmd = "snakefmt snappy_pipeline/workflows/*/Snakefile snappy_pipeline/workflows/*/*.rules", description = "Apply Snakefmt code formatter" }
shfmt = { cmd = "python tests/scripts/shell_templates.py --write", description = "Apply shfmt to the shell scripts and the shell templates of the wrappers" }
layout = { cmd = "python tests/scripts/class_layout.py --write", description = "Order the members of the workflow modules and their classes" }
srcfmt = { depends-on = ["fmt", "snakefmt", "shfmt", "layout"], description = "Apply Python, Snakemake and shell formatters and the module layout" }

check = { cmd = "ruff check .", description = "Run Ruff code checker" }
lint-fmt = { cmd = "ruff format --check .", description = "Check Python formatting" }
lint-snakefmt = { cmd = "snakefmt --check snappy_pipeline/workflows/*/Snakefile snappy_pipeline/workflows/*/*.rules", description = "Check Snakemake formatting" }
lint-shell = { cmd = "python tests/scripts/shell_templates.py", description = "Check the shell scripts and the shell templates of the wrappers with shfmt" }
lint-layout = { cmd = "python tests/scripts/class_layout.py", description = "Check the order of the members of the workflow modules and their classes" }
lint = { depends-on = ["check", "lint-fmt", "lint-snakefmt", "lint-shell", "lint-layout"], description = "Run all linters" }

[tool.pixi.feature.dev.dependencies]
pixi-pycharm = ">=0.0.11,<0.0.12"
pandas-stubs = ">=3.0.3.260530,<4"
go-shfmt = "==3.14.1"

[tool.pixi.feature.pins.tasks]
update-pins = { cmd = "python tests/scripts/update_pins.py", description = "Pin all pinned wrapper environments again, or the given environment files (snakedeploy, needs conda)" }

[tool.pixi.feature.pins.dependencies]
python = "3.12.*"
conda = ">=25,<26"

[tool.pixi.feature.pins.pypi-dependencies]
# From PyPI: the conda package caps packaging below 26
snakedeploy = ">=0.18.1,<0.19"
