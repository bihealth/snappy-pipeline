[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snappy-pipeline"
authors = [
    { name = "Manuel Holtgrewe", email = "manuel.holtgrewe@bih-charite.de" },
]
description = "SNAPPY Nucleic Acid Processing in Python (by CUBI)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["bioinformatics"]
license = { text = "MIT license" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
dependencies = [
    # Nice, round-trip enabled YAML parsing
    "ruamel.yaml >=0.18.6,<1",
    # File-based locks
    "fasteners >=0.17.3,<1",
    # We're trying to keep the PyPi package up to date, you might have to install
    # from source, though.
    "biomedsheets @ git+https://github.com/bihealth/biomedsheets.git@8a86f4c0b94b2c0bde14a22acf552387958ad688",
    # Helpful for CLIs
    "termcolor >=1.1.0,<3",
    # Snakemake is used for providing the actual wrapper calling functionality
    "snakemake >=9.19.0,<10",
    "snakemake-executor-plugin-slurm >=2,<3",
    # Required for plotting
    "matplotlib >=3.8.4",
    # Library for working with VCF files.
    "vcfpy >=0.13.8,<1",
    # Support for vcfpy
    "pysam >=0.22.1,<1",
    # Jinja 2 template rendering
    "jinja2 >=3.1.4,<4",
    # Parsing of ISA-tab.
    "altamisa @ git+https://github.com/bihealth/altamisa.git@7091c49dcea5584192daf0b0d8a4730208b841d8",
    # Validation for models, mainly used for configuration validation
    "pydantic >=2.9.0,<3"
    # Note: varfish-cli is used as an *external CLI tool* by pipeline users, not imported
    # as a Python library here. Install it separately.
]

[project.urls]
Repository = "https://github.com/bihealth/snappy-pipeline"
Documentation = "https://snappy-pipeline.readthedocs.io/en/latest/"
Issues = "https://github.com/bihealth/snappy-pipeline/issues"
Changelog = "https://github.com/bihealth/snappy-pipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest >=8.2.2,<10",
    "coverage >=7.5.3,<8",
    "pytest-cov >=5.0.0,<6",
    "pytest-mock >=3.14.0,<4",
    "pytest-subprocess >=1.5.0,<2",
    # Fake file system for testing
    "pyfakefs >=5.5.0,<6",
    "pytest-sugar >=1.0.0,<2",
    # coveralls.io tooling
    "coveralls >=4.0.1,<5",
    "pytabix >=0.1.0,<1"
]
dev = [
    # ruff code linter + formatter
    "ruff >=0.15.11,<1",
    # "snakefmt" code formatter and checker.
    "snakefmt >=1,<2",
    "pre-commit >=4.0.1,<5"
]
docs = [
    "sphinx >=7.3.7,<8",
    "sphinx_rtd_theme >=2.0.0,<3",
    "sphinx-mdinclude >=0.6.0,<1",
]
all = [
    "snappy-pipeline[test,docs,dev]"
]

[project.scripts]
snappy = "snappy_pipeline.apps.snappy_cli:main"
# additional tools
snappy-bed_filter_jaccard = "snappy_wrappers.tools.bed_filter_jaccard:main"
snappy-fix_vcf = "snappy_wrappers.tools.fix_vcf:main"
snappy-genome_windows = "snappy_wrappers.tools.genome_windows:main"
snappy-quickvenn = "snappy_wrappers.tools.quickvenn:main"
snappy-vcf_first_header = "snappy_wrappers.tools.vcf_first_header:main"
snappy-vcf_filter_denovo = "snappy_wrappers.tools.vcf_filter_denovo:main"
snappy-vcf_filter_from_info = "snappy_wrappers.tools.vcf_filter_from_info:main"
snappy-vcf_filter_to_info = "snappy_wrappers.tools.vcf_filter_to_info:main"
snappy-ped_to_vcf_header = "snappy_wrappers.tools.ped_to_vcf_header:main"


# ==============================================================================
# HATCHLING CONFIGURATION
# ==============================================================================

[tool.hatch.version]
path = "snappy_pipeline/version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["snappy_pipeline", "snappy_wrappers"]

[tool.hatch.build.targets.wheel.shared-data]
"scripts/snappy-vcf_sort" = "scripts/snappy-vcf_sort"
"scripts/snappy-vcf_split" = "scripts/snappy-vcf_split"


# ==============================================================================
# TOOL CONFIGURATIONS
# ==============================================================================

[tool.coverage.run]
omit = ["snappy_pipeline/_version.py", "snappy_pipeline/Snakefile", "snappy_pipeline/workflows/*/Snakefile", "snappy_wrappers/wrappers/*/wrapper.py"]
relative_files = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == '__main__':"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints",
    ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache",
    ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build",
    "dist", "node_modules", "site-packages", "venv", "docs", ".*.py",
    ".snakemake.*.wrapper.py", "splitMNPsAndComplex.py", "wrapper.py",
    "snappy_pipeline/__init__.py", ".tests",
]
line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B9"]  # enable "B", "C" later
ignore = ["E203", "E266", "E501", "B904", "B905", "E713", "E721", "E741"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
"snappy_wrappers/tools/gcnv_merge_vcfs.py" = ["E721"]
"docs/conf.py" = ["ALL"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.snakefmt]
line_length = 100
include = "\\.smk$|\\.rules$|^Snakefile"
exclude = "snappy_pipeline/Snakefile"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=snappy_pipeline --cov-report=xml"
markers = [
    "integration: tests requiring workflow-level integration setup",
    "slow: tests that are expected to take longer runtime",
]
testpaths = ["tests"]
norecursedirs = ["docs", "*.egg-info", ".git"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::coverage.exceptions.CoverageWarning",
]


# ==============================================================================
# PIXI CONFIGURATION
# ==============================================================================

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "nodefaults"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
git-lfs = "~=3.5.1"
gcc_linux-64 = "~=13.2.0"
gcc_impl_linux-64 = "~=13.2.0"
gxx_linux-64 = "~=13.2.0"
gxx_impl_linux-64 = "~=13.2.0"
sysroot_linux-64 = "~=2.17"
binutils_linux-64 = "*"
coreutils = "~=9.5"
gawk = "~=5.3.0"
bash = "~=5.2.21"
gzip = "~=1.13"
zlib = "~=1.3.0"
htslib = "1.20.*"
bcftools = "1.20.*"
samtools = "1.20.*"
conda = ">=25,<26"
snakemake = ">=9.19.0,<10"
snakemake-executor-plugin-slurm = ">=2,<3"
snakemake-logger-plugin-snkmt = ">=0.1.6"

# PREVENT CONFLICTS: Force Conda to pick older versions of these
# dependencies so that uv doesn't block the PyPI/Git package installations.
jsonschema = "<4.5"
tabulate = "<0.10"
docutils = "<0.21"
click = ">=8.4.0,<9"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
dev = { features = ["test", "docs", "dev"], solve-group = "default" }

[tool.pixi.pypi-dependencies]
snappy-pipeline = { path = ".", editable = true }

# ==============================================================================
# PIXI TASKS
# ==============================================================================

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", env = { PYTHONPATH = "." }, description = "Run tests through pytest" }
coverage = { cmd = "coverage report && coverage html", description = "Generate code coverage reports" }

[tool.pixi.feature.test.dependencies]
pytest-xdist = ">=3.8.0,<4"

[tool.pixi.feature.dev.tasks]
fmt = { cmd = "ruff format .", description = "Apply Ruff code formatter" }
snakefmt = { cmd = "snakefmt .", description = "Apply Snakefmt code formatter" }
srcfmt = { depends-on = ["fmt", "snakefmt"], description = "Apply Python and Snakemake formatters" }

check = { cmd = "ruff check .", description = "Run Ruff code checker" }
lint-fmt = { cmd = "ruff format --check .", description = "Check Python formatting" }
lint-snakefmt = { cmd = "snakefmt --check .", description = "Check Snakemake formatting" }
lint = { depends-on = ["check", "lint-fmt", "lint-snakefmt"], description = "Run all linters" }

[tool.pixi.feature.dev.dependencies]
pixi-pycharm = ">=0.0.11,<0.0.12"
pandas-stubs = ">=3.0.3.260530,<4"
