tasks:
  - name: genome
    step: external_data
    config:
      produces: {type: raw, tags: [reference, dna]}
      files: {fasta: ../../../.tests/test-workflow/resources/refs/subregion.fa}

data_sets:
  trbc:
    file: samplesheet.tsv
    search_patterns:
    - {left: '(?P<readgroup>.+)\.R1\.fastq\.gz', right: '(?P<readgroup>.+)\.R2\.fastq\.gz'}
    search_paths:
    - raw
    type: matched_cancer
    naming_scheme: only_secondary_id
